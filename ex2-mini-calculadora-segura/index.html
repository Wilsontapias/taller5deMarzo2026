<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mini Calculadora Segura</title>
    <link rel="stylesheet" href="style.css">    
    <script src="app.js"></script>
    <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.7.1/jquery.min.js"></script>
</head>
<body>

<div class="container">
    <h2>Mini Calculadora Segura</h2>
    <form id="calc-form">
        <input type="number" id="num1" step="any" placeholder="Número 1" required>
        <select id="operation">
            <option value="+">+</option>
            <option value="-">-</option>
            <option value="*">×</option>
            <option value="/">÷</option>
        </select>
        <input type="number" id="num2" step="any" placeholder="Número 2" required>
        <br>
        <button type="submit">Calcular</button>
    </form>

    <div id="result"></div>

    <div class="history-container">
        <h3>Historial de Operaciones</h3>
        <ul id="history-list"></ul>
    </div>
</div>

</body>
</html>
